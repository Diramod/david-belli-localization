<body>
  <div id="root"></div>

// ── Primitives ────────────────────────────────────────────────────────────

function FadeUp({ children, delay = 0, style }) {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const t = setTimeout(() => setVisible(true), delay);
    return () => clearTimeout(t);
  }, []);
  return (
    <div style={{
      opacity:    visible ? 1 : 0,
      transform:  visible ? 'translateY(0)' : 'translateY(20px)',
      transition: 'opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1)',
      ...style,
    }}>{children}</div>
  );
}

function Chip({ children, style }) {
  return (
    <span style={{
      display:        'inline-flex',
      flexDirection:  'column',
      alignItems:     'center',
      justifyContent: 'space-around',
      fontSize:       '11.5px',
      fontWeight:     600,
      letterSpacing:  '0.08em',
      textTransform:  'uppercase',
      padding:        '5px 14px',
      borderRadius:   '100px',
      background:     'oklch(100% 0 0 / 0.65)',
      border:         '1px solid oklch(100% 0 0 / 0.9)',
      boxShadow:      '0 1px 4px oklch(0% 0 0 / 0.08)',
      color:          'var(--accent)',
      backdropFilter: 'blur(8px)',
      ...style,
    }}>{children}</span>
  );
}

function GradText({ children, style }) {
  return (
    <span style={{
      background:           'linear-gradient(135deg, var(--accent), var(--accent2))',
      WebkitBackgroundClip: 'text',
      WebkitTextFillColor:  'transparent',
      backgroundClip:       'text',
      ...style,
    }}>{children}</span>
  );
}

// ── Nav ───────────────────────────────────────────────────────────────────

function Nav() {
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  return (
    <nav style={{
      position:        'fixed',
      top: 0, left: 0, right: 0,
      zIndex:          200,
      display:         'flex',
      alignItems:      'center',
      justifyContent:  'space-between',
      padding:         '0 40px',
      height:          '58px',
      background:      scrolled ? 'oklch(98% 0.003 80 / 0.75)' : 'transparent',
      backdropFilter:  scrolled ? 'blur(20px) saturate(1.5)' : 'none',
      WebkitBackdropFilter: scrolled ? 'blur(20px) saturate(1.5)' : 'none',
      borderBottom:    scrolled ? '1px solid oklch(100% 0 0 / 0.6)' : '1px solid transparent',
      boxShadow:       scrolled ? '0 1px 20px oklch(0% 0 0 / 0.05)' : 'none',
      transition:      'all 0.35s ease',
    }}>
      <span style={{ fontWeight: 700, fontSize: '17px', letterSpacing: '-0.02em', color: 'var(--fg)' }}>
        David Belli
      </span>
      <div style={{ display: 'flex', gap: '32px', alignItems: 'center' }}>
        <div className="nav-section-links" style={{ display: 'flex', gap: '32px', alignItems: 'center' }}>
          {['Credits', 'About', 'Services'].map((s) =>
            <a key={s} href={`#${s.toLowerCase()}`} style={{
              color: 'var(--fg-mid)', textDecoration: 'none', fontSize: '14px', fontWeight: 500, transition: 'color 0.2s',
            }}
            onMouseEnter={(e) => e.target.style.color = 'var(--fg)'}
            onMouseLeave={(e) => e.target.style.color = 'var(--fg-mid)'}>
              {s}
            </a>
          )}
        </div>
        <a className="nav-cta" href={`mailto:${EMAIL}`} style={{
          background: 'linear-gradient(135deg, var(--accent), var(--accent2))',
          color: '#fff', textDecoration: 'none', fontSize: '13.5px', fontWeight: 600,
          padding: '8px 22px', borderRadius: `${RADIUS}px`,
          boxShadow: '0 2px 12px oklch(52% 0.18 260 / 0.3)',
          transition: 'opacity 0.2s, transform 0.2s', display: 'inline-block', whiteSpace: 'nowrap',
        }}
        onMouseEnter={(e) => { e.currentTarget.style.opacity = '0.88'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
        onMouseLeave={(e) => { e.currentTarget.style.opacity = '1';    e.currentTarget.style.transform = 'translateY(0)'; }}>

    </nav>
  );
}

          <a href="#credits" style={{

      </FadeUp>
      <FadeUp delay={460}>

            <div key={s.l} style={{

              <span style={{ fontSize: '12px', color: 'var(--fg-dim)', fontWeight: 500, marginTop: '2px' }}>{s.l}</span>
            </div>

}

// ── About ─────────────────────────────────────────────────────────────────

function About() {

// ── Services ──────────────────────────────────────────────────────────────

function PkgCard({ pkg }) {
  const [hov, setHov] = React.useState(false);
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} style={{
      background: pkg.featured
        ? 'linear-gradient(160deg, oklch(100% 0 0 / 0.8) 0%, oklch(95% 0.04 260 / 0.7) 100%)'
        : 'oklch(100% 0 0 / 0.55)',
      backdropFilter: 'blur(24px) saturate(1.5)', WebkitBackdropFilter: 'blur(24px) saturate(1.5)',
      border: pkg.featured ? '1.5px solid oklch(52% 0.18 260 / 0.25)' : '1px solid oklch(100% 0 0 / 0.8)',
      borderRadius: `${RADIUS}px`, padding: '36px', display: 'flex', flexDirection: 'column',
      boxShadow: pkg.featured
        ? `0 8px 40px oklch(52% 0.18 260 / 0.15), 0 1px 0 oklch(100% 0 0 / 0.9) inset${hov ? ', 0 20px 60px oklch(52% 0.18 260 / 0.2)' : ''}`
        : '0 2px 20px oklch(0% 0 0 / 0.06), 0 1px 0 oklch(100% 0 0 / 0.9) inset',
      transform: hov ? 'translateY(-4px) scale(1.005)' : 'translateY(0) scale(1)',
      transition: 'transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s',
      position: 'relative', flex: 1,
    }}>
      {pkg.featured &&
        <div style={{
          position: 'absolute', top: '-14px', left: '50%', transform: 'translateX(-50%)',
          background: 'linear-gradient(135deg, var(--accent), var(--accent2))',
          color: '#fff', fontSize: '11px', fontWeight: 700, letterSpacing: '0.08em',
          textTransform: 'uppercase', padding: '5px 18px', borderRadius: '100px',
          boxShadow: '0 4px 16px oklch(52% 0.18 260 / 0.3)', whiteSpace: 'nowrap',
        }}>Most popular</div>
      }
      <Chip style={{ marginBottom: '20px', alignSelf: 'flex-start' }}>{pkg.tag}</Chip>
      <h3 style={{ fontSize: '24px', fontWeight: 700, letterSpacing: '-0.02em', marginBottom: '8px' }}>{pkg.name}</h3>
      <div style={{ marginBottom: '16px' }}>
        <GradText style={{ fontSize: '20px', fontWeight: 700, letterSpacing: '-0.02em' }}>{pkg.price}</GradText>
      </div>
      <p style={{ fontSize: '14px', color: 'var(--fg-mid)', lineHeight: 1.65, marginBottom: '24px' }}>{pkg.pitch}</p>
      <div style={{ borderTop: '1px solid oklch(0% 0 0 / 0.07)', paddingTop: '20px', marginBottom: '20px', flex: 1 }}>
        <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: '9px' }}>
          {pkg.items.map((item) =>
            <li key={item} style={{ display: 'flex', gap: '10px', fontSize: '13.5px', color: 'var(--fg-mid)', lineHeight: 1.5 }}>
              <span style={{
                width: '18px', height: '18px', borderRadius: '50%', flexShrink: 0, marginTop: '1px',
                background: 'linear-gradient(135deg, var(--accent), var(--accent2))',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <svg width="8" height="6" viewBox="0 0 8 6" fill="none">
                  <path d="M1 3l2 2 4-4" stroke="white" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </span>
              {item}
            </li>
          )}
        </ul>
      </div>
      <p style={{ fontSize: '12px', color: 'var(--fg-dim)', lineHeight: 1.6, marginBottom: '24px', fontStyle: 'italic' }}>{pkg.ideal}</p>
      <a href={`mailto:${EMAIL}`} style={{
        display: 'block', textAlign: 'center',
        background: pkg.featured ? 'linear-gradient(135deg, var(--accent), var(--accent2))' : 'oklch(0% 0 0 / 0.06)',
        color: pkg.featured ? '#fff' : 'var(--fg)', textDecoration: 'none',
        fontSize: '14px', fontWeight: 600, padding: '13px', borderRadius: `${RADIUS_BTN}px`,
        border: pkg.featured ? 'none' : '1px solid oklch(0% 0 0 / 0.08)',

        transition: 'opacity 0.2s', letterSpacing: '0.01em',
      }}
      onMouseEnter={(e) => e.currentTarget.style.opacity = '0.82'}
      onMouseLeave={(e) => e.currentTarget.style.opacity = '1'}>
        Get in touch →

  );

function CTA() {

            Ready to reach<br /><GradText>Italian players?</GradText>

          <p style={{ fontSize: '18px', color: 'var(--fg-mid)', lineHeight: 1.7, maxWidth: '460px', margin: '0 auto 44px' }}>

            color: '#fff', textDecoration: 'none', fontSize: '16px', fontWeight: 700,
            padding: '18px 52px', borderRadius: `${RADIUS}px`,
            boxShadow: '0 8px 40px oklch(52% 0.18 260 / 0.3)',
            letterSpacing: '0.01em', transition: 'opacity 0.2s, transform 0.15s', textAlign: 'center',

          onMouseEnter={(e) => { e.currentTarget.style.opacity = '0.88'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
          onMouseLeave={(e) => { e.currentTarget.style.opacity = '1';    e.currentTarget.style.transform = 'translateY(0)'; }}>
            {EMAIL}
          </a>
          <div style={{ marginTop: '16px', fontSize: '13px', color: 'var(--fg-dim)' }}>No commitment needed — just say hello.</div>
        </div>

    </section>

}
